<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma bibliothèque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="casting.css">
  <link rel="stylesheet" href="personnes.css">
</head>
<body class="rideaux-fermes">

  <!-- ===== Décor de la salle (fixe) ===== -->
  <div class="salle" aria-hidden="true">
    <div class="halo"></div>
    <div class="lambrequin"></div>
    <div class="rideau rideau-g"></div>
    <div class="rideau rideau-d"></div>
    <div class="penombre"></div>
    <div class="fauteuils">
      <div class="rangee rangee-fond"></div>
      <div class="rangee rangee-avant"></div>
    </div>
  </div>

  <!-- ===== Écran de connexion (sur les rideaux fermés) ===== -->
  <section id="ecran-connexion" class="connexion" hidden>
    <form id="form-connexion" class="plaque" novalidate>
      <p class="plaque-sur-titre">Séance privée</p>
      <h1 class="plaque-titre">Ma <em>bibliothèque</em></h1>

      <label class="champ">
        <span>Nom d'utilisateur</span>
        <input id="champ-utilisateur" name="utilisateur" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ethan" required>
      </label>
      <label class="champ">
        <span>Mot de passe</span>
        <input id="champ-mdp" name="mdp" type="password" autocomplete="current-password" required>
      </label>

      <p id="erreur-connexion" class="erreur" role="alert"></p>

      <button id="btn-connexion" class="btn-or" type="submit">Entrer dans la salle</button>
      <button id="btn-bascule" class="lien" type="button">Créer un compte</button>
    </form>
  </section>

  <!-- ===== Application (sur l'écran) ===== -->
  <main id="app" class="ecran" hidden>
    <header class="entete">
      <h1 class="logo">Ma <em>bibliothèque</em></h1>
      <div class="entete-actions">
        <label class="recherche">
          <span class="sr-only">Rechercher</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="recherche" type="search" placeholder="Titre, créateur, tag">
        </label>
        <button id="btn-ajouter" class="btn-or" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Ajouter
        </button>
        <button id="btn-annuaire" class="btn-sobre" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4.1 4.2 1.8 5 4.8"/></svg>
          Annuaire
        </button>
        <button id="btn-menu" class="btn-icone" type="button" aria-label="Options" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
        </button>
        <div id="menu" class="menu" hidden>
          <p id="menu-utilisateur" class="menu-info"></p>
          <button id="btn-animations" type="button"></button>
          <button id="btn-deconnexion" type="button">Se déconnecter</button>
        </div>
      </div>
    </header>

    <nav class="onglets" id="onglets" role="tablist" aria-label="Types de contenu"></nav>

    <div class="filtres" id="filtres">
      <button id="btn-filtres" class="btn-sobre filtres-bascule" type="button" aria-expanded="false" aria-controls="filtres-champs">
        Filtres <span id="filtres-nb" class="filtres-nb" hidden>0</span>
      </button>
      <div id="filtres-champs" class="filtres-champs">
        <select id="filtre-statut" aria-label="Filtrer par statut">
          <option value="">Tous les statuts</option>
          <option value="a_voir">À voir</option>
          <option value="en_cours">En cours</option>
          <option value="termine">Terminé</option>
          <option value="abandonne">Abandonné</option>
          <option value="incertain">Incertain</option>
        </select>
        <select id="filtre-genre" aria-label="Filtrer par genre">
          <option value="">Tous les genres</option>
        </select>
        <select id="filtre-annee" aria-label="Filtrer par décennie">
          <option value="">Toutes les années</option>
        </select>
        <select id="filtre-createur" aria-label="Filtrer par réalisateur, créateur ou chaîne">
          <option value="">Tous les créateurs</option>
        </select>
        <input id="filtre-acteur" type="text" list="dl-acteurs" autocomplete="off" spellcheck="false" aria-label="Filtrer par acteur" placeholder="Chargement…" disabled>
        <datalist id="dl-acteurs"></datalist>
        <input id="filtre-producteur" type="text" list="dl-producteurs" autocomplete="off" spellcheck="false" aria-label="Filtrer par producteur" placeholder="Chargement…" disabled>
        <datalist id="dl-producteurs"></datalist>
        <select id="filtre-tag" aria-label="Filtrer par tag">
          <option value="">Tous les tags</option>
        </select>
        <select id="tri" aria-label="Trier">
          <option value="recent">Ajout récent</option>
          <option value="visionnage">Date de visionnage</option>
          <option value="note">Meilleure note</option>
          <option value="titre">Titre (A → Z)</option>
        </select>
        <button id="btn-reinitialiser" class="filtres-reinit" type="button" hidden>Réinitialiser les filtres</button>
      </div>
    </div>

    <section id="grille" class="grille" aria-live="polite"></section>
  </main>

  <!-- ===== Séance : fiche détaillée ou formulaire, projetée en plein écran ===== -->
  <div id="seance" class="seance" role="dialog" aria-modal="true" aria-labelledby="seance-titre" hidden>
    <div class="seance-panneau">
      <button id="seance-fermer" class="btn-icone seance-fermer" type="button" aria-label="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="seance-contenu"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="casting.js"></script>
  <script src="personnes.js"></script>
</body>
</html>
